<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Inline SVG favicon (data URI) — no network request, so no /favicon.ico 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c6f64'/%3E%3Cpath d='M9 8.5h8.5a4 4 0 0 1 4 4V24a3 3 0 0 0-3-3H9z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M23 8.5h-2.2a3 3 0 0 0-3 3V21' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round' opacity='.55'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="sayumi — a fast, self-hosted EPUB reader with themes, custom fonts, vertical writing, and synced reading progress."
    />
    <title>sayumi</title>
    <!-- Preload the interface typefaces (served by the Go binary) to cut
         first-paint FOUT/CLS for the serif wordmark and UI text. -->
    <link
      rel="preload"
      href="/fonts/Fraunces-VariableFont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Fraunces-Italic-VariableFont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/HankenGrotesk-VariableFont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Pre-paint theme bootstrap: apply the last-used theme's cached tokens
         before the app (and its server settings) load, so a reload doesn't
         flash the default light theme. Inline element styles override app.css
         :root defaults; no-ops safely when storage is empty or blocked, and
         a malformed cache is refused whole — the same shape check applyCachedTheme
         runs in lib/theme.ts. This is the app shell, not the sandboxed reader
         iframe — its CSP is untouched. -->
    <script>
      (function () {
        try {
          var v = JSON.parse(
            localStorage.getItem("sayumi:theme-vars") || "null",
          );
          if (!v) return;
          // The writer (applyTheme, lib/theme.ts) always stores the full shape;
          // a cache missing or mistyping a core token is corrupt or stale, and
          // painting it would hold broken vars until the settings load lands.
          if (
            typeof v.bg !== "string" ||
            typeof v.fg !== "string" ||
            typeof v.accent !== "string" ||
            typeof v.accentFg !== "string" ||
            typeof v.scheme !== "string"
          ) {
            return;
          }
          var s = document.documentElement.style;
          s.setProperty("--bg", v.bg);
          s.setProperty("--fg", v.fg);
          s.setProperty("--accent", v.accent);
          s.setProperty("--accent-fg", v.accentFg);
          // Older caches predate these two tokens; the :root fallbacks
          // cover first paint, and the settings load applies the real values.
          if (v.elevated) s.setProperty("--elevated", v.elevated);
          if (v.accentInk) s.setProperty("--accent-ink", v.accentInk);
          s.colorScheme = v.scheme;
          if (typeof v.id === "string")
            document.documentElement.dataset.theme = v.id;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
