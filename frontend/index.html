<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Tab/app icons, matching the desktop icon (cmd/sayumi/winres). Files live
         in frontend/public and are copied into dist, which the Go binary embeds. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="description"
      content="sayumi — a fast, self-hosted EPUB reader with themes, custom fonts, vertical writing, and synced reading progress."
    />
    <title>sayumi</title>
    <!-- Preload the interface typefaces (served by the Go binary) to cut
         first-paint FOUT/CLS for the serif wordmark and UI text. -->
    <link
      rel="preload"
      href="/fonts/Fraunces-VariableFont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Fraunces-Italic-VariableFont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/HankenGrotesk-VariableFont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Pre-paint theme bootstrap: apply the last-used theme's cached tokens
         before the app (and its server settings) load, so a reload doesn't
         flash the default theme (app.css :root, kept in step with
         DEFAULT_THEME_ID in lib/themes.ts) before the saved one lands. Inline
         element styles override app.css :root defaults; no-ops safely when
         storage is empty or blocked, and
         a malformed cache is refused whole — the same shape check applyCachedTheme
         runs in lib/theme.ts. This is the app shell, not the sandboxed reader
         iframe — its CSP is untouched. -->
    <script>
      (function () {
        try {
          var v = JSON.parse(
            localStorage.getItem("sayumi:theme-vars") || "null",
          );
          if (!v) return;
          // The writer (applyTheme, lib/theme.ts) always stores the full shape;
          // a cache missing or mistyping a core token is corrupt or stale, and
          // painting it would hold broken vars until the settings load lands.
          // scheme is the one entry that lands on a real CSS property rather
          // than a custom one, so it is checked by value: an unrecognized
          // scheme leaves the controls and scrollbars on the opposite scheme
          // from the palette painted around them.
          if (
            typeof v.bg !== "string" ||
            typeof v.fg !== "string" ||
            typeof v.accent !== "string" ||
            typeof v.accentFg !== "string" ||
            (v.scheme !== "light" && v.scheme !== "dark")
          ) {
            return;
          }
          var s = document.documentElement.style;
          s.setProperty("--bg", v.bg);
          s.setProperty("--fg", v.fg);
          s.setProperty("--accent", v.accent);
          s.setProperty("--accent-fg", v.accentFg);
          // Older caches predate these two tokens. app.css :root derives both
          // from the palette set just above, so leaving them unset is the one
          // fallback both cache readers share (applyCachedTheme in
          // lib/theme.ts does the same); the settings load then paints the
          // exact values and rewrites the cache with them.
          if (v.elevated) s.setProperty("--elevated", v.elevated);
          if (v.accentInk) s.setProperty("--accent-ink", v.accentInk);
          s.colorScheme = v.scheme;
          if (typeof v.id === "string")
            document.documentElement.dataset.theme = v.id;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
