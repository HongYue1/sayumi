# Keeps the go.mod `go` directive on the newest patch of the current minor,
# because govulncheck fails the gate the moment the pinned toolchain has a
# stdlib vulnerability with a fix available (dependabot only bumps the `go`
# directive when a dependency demands it, so patch releases go unnoticed).
#
# The bump PR must be self-validating: PRs opened with GITHUB_TOKEN do not
# trigger the ci.yml pull_request workflow. A read-only job runs make check;
# a fresh, cache-free job publishes only that validated Go directive change.
# Minor/dependency/tidy changes stay manual, deliberate updates.
#
# Repository prerequisite: Actions > General > Workflow permissions > Allow
# GitHub Actions to create and approve pull requests. YAML permissions alone
# cannot enable that policy; default workflow permissions can stay read-only.
# This workflow creates/updates PRs only, never approves or merges them.
name: Go toolchain bump

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, away from the busy hour boundary
  workflow_dispatch:

permissions: {}

# Do not interrupt a validated run halfway through publishing its single PR.
concurrency:
  group: go-toolchain-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Validate Go patch version
    # A manual run from a feature branch must not publish that branch as a bump.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      version: ${{ steps.validated.outputs.version }}
      mod-blob: ${{ steps.validated.outputs.mod-blob }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      # Validate with setup-go's selected patch, never an auto-selected minor.
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Freeze the event commit: never validate a moving branch tip.
          ref: ${{ github.sha }}
          # Build scripts and dependency install hooks do not need Git credentials.
          persist-credentials: false

      # Resolve the newest patch inside the go.mod minor. Using `stable` here
      # crosses into a newly released minor before the repo, its linters, and CI
      # are ready for it—the opposite of this workflow's patch-only contract.
      - name: Read current Go minor
        id: go-minor
        run: |
          set -euo pipefail
          GO_VERSION="$(awk '$1 == "go" { sub(/\r$/, "", $2); print $2 }' go.mod)"
          if [[ ! "$GO_VERSION" =~ ^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::go.mod must pin a Go patch release (got '$GO_VERSION')"
            exit 1
          fi
          echo "current=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${GO_VERSION%.*}.x" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-minor.outputs.version }}
          check-latest: true
          # Candidate checks neither consume nor populate default-branch caches.
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
          no-cache: true

      - name: Bump go directive to the newest patch
        id: bump
        env:
          OLDGO: ${{ steps.go-minor.outputs.current }}
        run: |
          set -euo pipefail
          go get go@patch
          go mod tidy
          NEWGO="$(go list -m -f '{{.GoVersion}}')"
          if [[ ! "$NEWGO" =~ ^1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
                || "${NEWGO%.*}" != "${OLDGO%.*}" ]] \
             || (( 10#${NEWGO##*.} < 10#${OLDGO##*.} )); then
            echo "::error::Expected a non-decreasing patch of $OLDGO, got '$NEWGO'"
            exit 1
          fi
          if git diff --quiet -- go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on the newest patch release."
          else
            DIFF_STATUS=$?
            if [[ "$DIFF_STATUS" != 1 ]]; then
              echo "::error::git diff failed ($DIFF_STATUS); not a toolchain change"
              exit "$DIFF_STATUS"
            fi
            # A tidy-only change is not a toolchain bump; leave it for review.
            if [[ "$NEWGO" == "$OLDGO" ]]; then
              echo "::error::Module files changed without a Go patch bump"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEWGO" >> "$GITHUB_OUTPUT"
          fi

      # Share pin ownership with contributor setup and the other workflows.
      - name: Install Go quality tools (pinned)
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: bash ./provision.sh quality-tools

      # make check builds the embedded frontend before running the Go gates.
      - name: Install frontend deps
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: bash ./provision.sh frontend

      - name: Run checks on the bumped toolchain
        id: quality
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for tool in bun gofumpt goimports golangci-lint govulncheck gcc; do
            command -v "$tool"
          done
          test "$(go env CGO_ENABLED)" = 1
          make check

      - name: Verify the module handoff
        id: validated
        if: steps.bump.outputs.changed == 'true'
        env:
          NEWGO: ${{ steps.bump.outputs.version }}
        run: bash .github/scripts/go-toolchain-patch.sh verify

  publish:
    name: Propose validated Go patch
    needs: bump
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.bump.result == 'success' && needs.bump.outputs.changed == 'true'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No dependency installs, cached executables or build artifacts cross into
      # this job. Reconstruct the one permitted edit from this trusted checkout.
      - name: Reconstruct the validated module
        id: prepare
        env:
          NEWGO: ${{ needs.bump.outputs.version }}
          MOD_BLOB: ${{ needs.bump.outputs.mod-blob }}
        run: bash .github/scripts/go-toolchain-patch.sh prepare

      - name: Open (or update) the bump PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NEWGO: ${{ needs.bump.outputs.version }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${NEWGO:?missing validated Go version}"
          BRANCH="deps/go-toolchain-patch"
          # Expose Git authentication only after all build and check steps pass.
          gh auth setup-git
          BASE_HEAD="$(git ls-remote --exit-code --heads origin "refs/heads/$BASE_BRANCH" | cut -f1)"
          if [[ "$BASE_HEAD" != "$BASE_SHA" ]]; then
            echo "::error::Default branch moved after validation; rerun from its new tip."
            exit 1
          fi
          REMOTE_HEAD="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ -n "$REMOTE_HEAD" && ! "$REMOTE_HEAD" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Invalid remote bot-branch tip"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- go.mod
          TITLE="build(ci): bump Go to ${NEWGO}"
          git commit -m "$TITLE"
          # Replace the bot branch only if it still has the tip we just observed;
          # an empty lease also protects the first push from racing a new branch.
          git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_HEAD" \
            origin "HEAD:refs/heads/$BRANCH"
          BODY="Automated toolchain patch bump (\`go get go@patch\`) so the
          govulncheck gate stays green. Validated by a full \`make check\` run in
          the read-only job at base \`$BASE_SHA\` (CI does not trigger on GITHUB_TOKEN PRs)."
          # Do not hide an API/create failure behind an unrelated edit attempt.
          PR="$(gh pr list --state open --base "$BASE_BRANCH" --head "$BRANCH" \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$PR" ]]; then
            gh pr edit "$PR" --title "$TITLE" --body "$BODY"
          else
            if ! gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
              --title "$TITLE" --body "$BODY"; then
              echo "::error::Bump branch pushed, but PR creation failed. See the gh error above."
              echo "If repository policy blocked creation, enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
              echo "Default workflow permissions can remain read-only."
              exit 1
            fi
          fi
