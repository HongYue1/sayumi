name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Required checks must also report against the merge queue's synthetic commit.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Check the toolchain selected from go.mod, not an automatic replacement.
  GOTOOLCHAIN: local

# Only newer revisions of the same PR supersede work. Pushes, merge groups and
# manual runs are independent, including two event types for the same commit.
# A separate run_id also prevents replacement of an older pending default run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Force cgo so check.sh runs `go test -race` (and FAILS on data races)
      # instead of silently downgrading to a plain `go test`.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # GitHub scopes PR-written caches to the PR merge ref. They cannot be
          # restored by the base branch; no privileged job consumes these caches.
          cache: true
          cache-dependency-path: |
            go.sum
            provision.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Install workflow validator (pinned)
        shell: bash
        run: bash ./provision.sh workflow-tools

      - name: Validate CI and maintenance workflows
        shell: bash
        run: make workflow-check

      - name: Install frontend deps
        shell: bash
        run: bash ./provision.sh frontend

      # Share pin ownership with contributor setup and the other workflows.
      - name: Install Go quality tools (pinned)
        shell: bash
        run: bash ./provision.sh quality-tools

      # make check rebuilds the embedded frontend and enforces required tools.
      # CI additionally requires cgo/race support, unlike a cgo-disabled local run.
      - name: Run checks
        run: |
          set -euo pipefail
          for tool in bun gofumpt goimports golangci-lint govulncheck gcc; do
            command -v "$tool"
          done
          test "$(go env CGO_ENABLED)" = 1
          make check

  platform-test:
    name: Native test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Linux covers the race detector; native hosts exercise the shipped pure-Go build.
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            provision.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
      - name: Install frontend deps
        shell: bash
        run: bash ./provision.sh frontend
      - name: Build frontend
        working-directory: frontend
        run: bun run build
      # Native regression tests execute the formatters, not the Linux linters.
      - name: Install Go formatter test tools (pinned)
        shell: bash
        run: bash ./provision.sh format-tools
      - name: Run native Go tests
        run: go test -shuffle=on ./...
