name: Release

# Only a tag PUSH may publish. Manual runs (including on tags) are read-only
# validation/builds, never release or attestation writes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Use the toolchain selected from go.mod, not an automatic replacement.
  GOTOOLCHAIN: local

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Dependency install scripts, tests and builds never get publishing tokens.
    permissions:
      contents: read
    env:
      CGO_ENABLED: "1" # require the race detector in the quality gates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for local version fallback and source epoch
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      # The same maintained regressions also run under make check locally.
      - name: Release regressions (offline)
        id: regressions
        shell: bash
        run: bun .github/scripts/release-tests.mjs

      - name: Install frontend deps
        shell: bash
        run: bash ./provision.sh frontend

      - name: Install Go quality tools (pinned)
        shell: bash
        run: bash ./provision.sh quality-tools

      # check.sh requires quality tools and rebuilds the SPA before Go checks.
      # Release validation additionally requires cgo/race support.
      - name: Quality gates (test, lint, govulncheck)
        id: quality
        run: |
          set -euo pipefail
          for tool in bun gofumpt goimports golangci-lint govulncheck gcc; do
            command -v "$tool"
          done
          test "$(go env CGO_ENABLED)" = 1
          make check

      - name: Install go-winres
        shell: bash
        run: bash ./provision.sh release-tools

      - name: Build release artifacts
        id: artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./release.sh

      - name: Upload checked artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          if-no-files-found: error
          compression-level: 0 # the payloads are already compressed
          path: |
            dist-release/sayumi-darwin-amd64.tar.gz
            dist-release/sayumi-darwin-arm64.tar.gz
            dist-release/sayumi-linux-amd64.tar.gz
            dist-release/sayumi-linux-arm64.tar.gz
            dist-release/sayumi-windows-amd64.zip
            dist-release/sayumi-windows-arm64.zip
            dist-release/SHA256SUMS

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Consume only this run's immutable artifact. Do not check out sources,
      # install dependencies, extract release archives, or execute their binaries
      # in the job that holds publishing credentials.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist-release

      - name: Verify complete release payload
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # Runner Node standard library only: no checkout, installs or artifact
          # execution. Keep this verifier inline so it cannot come from a bundle.
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const dir = "dist-release";
          const expected = [
            "sayumi-darwin-amd64.tar.gz", "sayumi-darwin-arm64.tar.gz",
            "sayumi-linux-amd64.tar.gz", "sayumi-linux-arm64.tar.gz",
            "sayumi-windows-amd64.zip", "sayumi-windows-arm64.zip",
          ];
          assert.deepEqual(readdirSync(dir).sort(), [...expected, "SHA256SUMS"].sort());
          for (const name of [...expected, "SHA256SUMS"]) {
            const info = lstatSync(join(dir, name));
            assert.ok(info.isFile() && !info.isSymbolicLink() && info.size > 0, name);
          }
          const sums = readFileSync(join(dir, "SHA256SUMS"), "utf8");
          assert.ok(sums.endsWith("\n"), "manifest must end with a newline");
          const lines = sums.slice(0, -1).split("\n");
          assert.equal(lines.length, expected.length);
          for (const [i, name] of expected.entries()) {
            const hash = createHash("sha256").update(readFileSync(join(dir, name))).digest("hex");
            assert.equal(lines[i], `${hash} *${name}`, `invalid checksum entry: ${name}`);
          }
          console.log("All six release archives verified.");
          JS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist-release/sayumi-darwin-amd64.tar.gz
            dist-release/sayumi-darwin-arm64.tar.gz
            dist-release/sayumi-linux-amd64.tar.gz
            dist-release/sayumi-linux-arm64.tar.gz
            dist-release/sayumi-windows-amd64.zip
            dist-release/sayumi-windows-arm64.zip

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            dist-release/sayumi-darwin-amd64.tar.gz
            dist-release/sayumi-darwin-arm64.tar.gz
            dist-release/sayumi-linux-amd64.tar.gz
            dist-release/sayumi-linux-arm64.tar.gz
            dist-release/sayumi-windows-amd64.zip
            dist-release/sayumi-windows-arm64.zip
            dist-release/SHA256SUMS
